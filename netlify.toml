# Netlify config for the Raphl web app (lives in web/).
# Set environment variables in the Netlify UI (Site settings → Environment variables):
#   DATABASE_URL (Supabase pooled, 6543) · DIRECT_URL (Supabase direct, 5432) ·
#   AUTH_SECRET · AUTH_TRUST_HOST=true · APP_URL ·
#   S3_BUCKET · S3_ENDPOINT · S3_ACCESS_KEY_ID · S3_SECRET_ACCESS_KEY · S3_REGION=auto ·
#   RESEND_API_KEY · EMAIL_FROM
# See web/.env.example for the full contract.

[build]
  base = "web"
  # Publish dir is resolved relative to the repo root (where this file lives), so
  # this points at web/.next — the Next.js build output in this monorepo layout.
  publish = "web/.next"
  # DEFAULT for every context (incl. deploy-preview / branch-deploy): build only,
  # NO migrations. Untrusted PR code must never run `prisma migrate deploy`.
  command = "npx prisma generate && npm run build"

[build.environment]
  NODE_VERSION = "20"

# Migrations run ONLY on the production deploy (post-merge to the production
# branch = a trusted context). For defense in depth, scope DATABASE_URL and
# DIRECT_URL to the *Production* deploy context in the Netlify UI
# (Site settings → Environment variables → Deploy contexts) so preview/branch
# builds can't reach the prod database even if this command changes.
# To manage migrations fully out-of-band instead, drop the migrate step here and
# run `prisma migrate deploy` from CI on main (or manually) after merge.
[context.production]
  command = "npx prisma generate && npx prisma migrate deploy && npm run build"

# Official Next.js runtime adapter (App Router, server actions, route handlers).
[[plugins]]
  package = "@netlify/plugin-nextjs"
