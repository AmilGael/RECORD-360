name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint · test · build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    # The action/server tests use the real Prisma client against a live DB,
    # so CI runs Postgres as a service and applies migrations before testing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: record360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/record360_test
      # No pooler in CI, so the direct URL is the same as DATABASE_URL.
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/record360_test
      # Non-secret placeholders so build/runtime code that reads these doesn't fail.
      # Real values are configured per-environment at deploy time (see web/.env.example).
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      AUTH_TRUST_HOST: "true"
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
